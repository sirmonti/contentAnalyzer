<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="extName">Content Analyzer</title>
    <style>
        /* ==========================================================================
           COLOR VARIABLES AND BASE STYLES (Whites and Blues)
           ========================================================================== */
        :root {
            --color-blue-dark: #003366;
            --color-blue-primary: #0056b3;
            --color-blue-secondary: #007bff;
            --color-blue-light: #e6f0fa;
            --color-blue-border: #cce0f5;
            --color-white: #ffffff;
            --color-text-main: #333333;
            --color-text-muted: #666666;

            --shadow-sm: 0 2px 4px rgba(0, 86, 179, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 86, 179, 0.1);
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-blue-light);
            color: var(--color-text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.2;
        }

        /* ==========================================================================
           TOP BAR (TOPBAR)
           ========================================================================== */
        .topbar {
            background-color: var(--color-blue-primary);
            color: var(--color-white);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            z-index: 10;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar-logo {
            height: auto;
            max-height: 40px;
            width: auto;
            border-radius: 8px;
            /* To somewhat match the rounded corners of the original logo */
        }

        .topbar h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* Top bar menu (Hidden on desktop by default) */
        .top-nav {
            display: none;
            gap: 1.5rem;
        }

        .top-nav a {
            color: var(--color-blue-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .top-nav a:hover {
            color: var(--color-white);
        }

        /* ==========================================================================
           MAIN CONTAINER AND SIDEBAR (LAYOUT)
           ========================================================================== */
        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            /* Prevents scroll on the entire layout to apply it only to the main content */
        }

        .sidebar {
            width: 260px;
            background-color: var(--color-white);
            border-right: 1px solid var(--color-blue-border);
            display: flex;
            flex-direction: column;
            padding-top: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            font-size: 1.8em;
        }

        .side-nav a {
            color: var(--color-text-main);
            text-decoration: none;
            padding: 1rem 2rem;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .side-nav a:hover {
            background-color: var(--color-blue-light);
            color: var(--color-blue-primary);
            border-left-color: var(--color-blue-primary);
        }

        /* ==========================================================================
           CONTENT AREA (HEADER AND INFORMATION)
           ========================================================================== */
        .main-content {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        /* Data header */
        .info-header {
            background-color: var(--color-white);
            border: 1px solid var(--color-blue-border);
            border-radius: var(--border-radius);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .info-grid {
            display: grid;
            /* The first column (URL) takes up all remaining space (1fr), 
               the others take only the space of their content (auto) */
            grid-template-columns: 1fr auto auto auto;
            gap: 2rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            /* We prevent the content (especially the long URL) from breaking the column */
            min-width: 0;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.1rem;
            color: var(--color-blue-dark);
            font-weight: 500;
            word-break: break-all;
        }

        /* Body / Result box */
        .content-body {
            background-color: var(--color-white);
            border: 1px solid var(--color-blue-border);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }

        .content-body-title {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--color-blue-border);
            background-color: #fcfdfe;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
        }

        .content-body-title h2 {
            font-size: 1.2rem;
            color: var(--color-blue-primary);
            margin: 0;
        }

        .result-box {
            padding: 2rem;
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--color-text-main);
            white-space: pre-wrap;
            background-color: var(--color-white);
            border-bottom-left-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
            min-height: 250px;
        }

        .loader {
            border: 4px solid #444;
            border-top: 4px solid #8be9fd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #status {
            padding: 2rem;
            color: var(--color-blue-primary);
            font-weight: 500;
        }

        #saveBtn {
            margin: 1.5rem auto;
            padding: 0.8rem 1.5rem;
            background-color: var(--color-blue-primary);
            color: var(--color-white);
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            align-self: center;
            transition: background-color 0.2s;
        }

        #saveBtn:hover {
            background-color: var(--color-blue-dark);
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (MOBILE AND SMALL SCREENS)
           ========================================================================== */
        .menu-toggle-btn {
            display: none;
            background: none;
            border: none;
            color: var(--color-white);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            line-height: 1;
        }
        .menu-toggle-btn:focus {
            outline: none;
        }

        .menu-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: none;
        }
        .menu-backdrop.active {
            display: block;
        }

        .sidebar-header {
            display: none;
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (MOBILE AND SMALL SCREENS)
           ========================================================================== */
        @media (max-width: 768px) {
            .layout-container {
                flex-direction: column;
            }

            .menu-toggle-btn {
                display: block;
            }

            /* Restructure top bar to be compact */
            .topbar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 1rem 1.2rem;
            }

            .topbar h1 {
                font-size: 1.35rem;
            }

            /* Hide header links on mobile to save vertical space */
            .top-nav {
                display: none !important;
            }

            /* Collapsible slide-in sidebar on mobile */
            .sidebar {
                display: flex !important;
                position: fixed;
                top: 0;
                left: -280px; /* Hidden offscreen */
                width: 280px;
                height: 100vh;
                background-color: var(--color-white);
                z-index: 1000;
                box-shadow: 2px 0 10px rgba(0,0,0,0.2);
                transition: left 0.3s ease;
                flex-direction: column;
                padding-top: 0;
            }
            .sidebar.open {
                left: 0; /* Slide in */
            }

            .sidebar-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1.2rem 1.5rem;
                border-bottom: 1px solid var(--color-blue-border);
                background-color: var(--color-blue-light);
            }
            .sidebar-title {
                font-weight: bold;
                color: var(--color-blue-dark);
                font-size: 1.25rem;
            }
            .sidebar-close {
                background: none;
                border: none;
                font-size: 2rem;
                cursor: pointer;
                color: var(--color-text-muted);
                line-height: 1;
            }

            .side-nav a {
                padding: 1.2rem 2rem; /* Larger touch area */
                font-size: 1.15rem; /* Larger text */
            }

            .main-content {
                padding: 0.75rem;
            }

            .info-header {
                padding: 1rem;
                margin-bottom: 1rem;
            }

            .info-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.85rem;
            }

            /* URL takes full width */
            .info-item:first-child {
                grid-column: span 2;
            }

            .info-label {
                font-size: 0.95rem;
            }

            .info-value {
                font-size: 1.15rem;
            }

            .content-body-title {
                padding: 1.2rem 1rem;
            }

            .content-body-title h2 {
                font-size: 1.35rem;
            }

            .result-box {
                padding: 1.2rem 1rem;
                font-size: 1.2rem; /* Larger font size for readability */
                line-height: 1.7;
            }

            #status {
                padding: 2rem 1rem;
                font-size: 1.15rem;
            }

            #saveBtn {
                width: calc(100% - 2rem);
                box-sizing: border-box;
                margin: 1.5rem auto;
                padding: 1rem 1.5rem;
                font-size: 1.15rem;
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div id="menu-backdrop" class="menu-backdrop"></div>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-brand">
            <picture>
                <!-- Large screens (Desktop): Loads high resolution logo -->
                <source media="(min-width: 1024px)" srcset="Iconos/Icono128.png">
                <!-- Medium screens (Tablets): Loads intermediate logo -->
                <source media="(min-width: 768px)" srcset="Iconos/Icono48.png">
                <!-- Small screens (Mobile landscape): Loads small logo -->
                <source media="(min-width: 480px)" srcset="Iconos/Icono32.png">
                <!-- Default (Very small mobiles): Loads the smallest icon -->
                <img src="Iconos/Icono16.png" alt="Content Analyzer Logo" class="topbar-logo">
            </picture>
            <h1 data-i18n="extName">Content Analyzer</h1>
        </div>
        <button id="menu-toggle" class="menu-toggle-btn" aria-label="Toggle menu">☰</button>

        <!-- Menu shown only on mobile devices -->
        <nav class="top-nav" aria-label="Top menu">
            <a data-i18n="resHelp" target="_blank" rel="noopener noreferrer" href="https://sirmonti.github.io/contentAnalyzer/usage.html">Help</a>
            <a data-i18n="resPrivacy" target="_blank" rel="noopener noreferrer"
                href="https://sirmonti.github.io/contentAnalyzer/privacy.html">Privacy</a>
            <a data-i18n="resContact" target="_blank" rel="noopener noreferrer"
                href="https://sirmonti.github.io/contentAnalyzer/contact.html">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="layout-container">

        <!-- SIDE NAV COLUMN -->
        <!-- Menu shown only on large screens (desktop/landscape tablet) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title" data-i18n="popupTitle">Menu</span>
                <button id="sidebar-close-btn" class="sidebar-close">&times;</button>
            </div>
            <nav class="side-nav" aria-label="Side menu">
                <a data-i18n="resHelp" target="_blank" rel="noopener noreferrer"
                    href="https://sirmonti.github.io/contentAnalyzer/usage.html">Help</a>
                <a data-i18n="resPrivacy" target="_blank" rel="noopener noreferrer"
                    href="https://sirmonti.github.io/contentAnalyzer/privacy.html">Privacy</a>
                <a data-i18n="resContact" target="_blank" rel="noopener noreferrer"
                    href="https://sirmonti.github.io/contentAnalyzer/contact.html">Contact</a>
            </nav>
        </aside>

        <!-- DATA AREA -->
        <main class="main-content">

            <!-- HEADER -->
            <section class="info-header">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">URL</span>
                        <a class="info-value" id="PAGEURL" target="_blank" rel="noopener noreferrer">https://ejemplo.com/pagina-analizada</a>
                    </div>
                    <div class="info-item">
                        <span class="info-label" data-i18n="resSysLang">System Language</span>
                        <!-- The value will be filled dynamically via JS -->
                        <span class="info-value" id="SYSLANG">en</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" data-i18n="resPageLang">Page Language</span>
                        <span class="info-value" id="PAGELANG">es-ES</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" data-i18n="resCharCount">Query Length</span>
                        <span class="info-value" id="CHARCOUNT">0</span>
                    </div>
                </div>
            </section>

            <!-- BODY -->
            <section class="content-body">
                <div class="content-body-title">
                    <h2><span data-i18n="resHeader">Result - </span><span id="serviceName">...</span></h2>
                </div>
                <div id="status" style="display:block">
                    <div class="loader"></div>
                    <span data-i18n="statusProcessing">Processing...</span>
                </div>
                <!-- Box with the analysis text -->
                <div class="result-box" id="resultBox" style="display:none"></div>

                <!-- Save button -->
                <button id="saveBtn" data-i18n="resSaveBtn" style="display:none">Save to file</button>
            </section>

        </main>
    </div>
    <script src="i18n.js"></script>
    <script src="marked.min.js"></script>
    <script src="result.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggle = document.getElementById("menu-toggle");
            const sidebarClose = document.getElementById("sidebar-close-btn");
            const sidebar = document.querySelector(".sidebar");
            const backdrop = document.getElementById("menu-backdrop");

            function toggleMenu() {
                sidebar.classList.toggle("open");
                backdrop.classList.toggle("active");
            }

            function closeMenu() {
                sidebar.classList.remove("open");
                backdrop.classList.remove("active");
            }

            if (menuToggle) menuToggle.addEventListener("click", toggleMenu);
            if (sidebarClose) sidebarClose.addEventListener("click", closeMenu);
            if (backdrop) backdrop.addEventListener("click", closeMenu);
        });
    </script>
</body>

</html>
