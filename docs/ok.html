<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var supportedLangs = ['ar', 'de', 'en', 'es', 'fr', 'he', 'it', 'ja', 'ko', 'pl', 'pt', 'ru', 'zh'];
            var userLang = navigator.language || navigator.userLanguage;
            var shortLang = userLang ? userLang.substring(0, 2).toLowerCase() : 'en';
            
            var targetLang = 'en';
            if (supportedLangs.indexOf(shortLang) !== -1) {
                targetLang = shortLang;
            }
            
            var filename = window.location.pathname.split('/').pop() || 'index.html';
            window.location.replace(targetLang + '/' + filename);
        })();
    </script>
</head>
<body>
</body>
</html>
