<div class="max-w-container-max mx-auto p-md md:p-xl w-full">
<article class="w-full max-w-container-max mx-auto p-md lg:p-xl bg-surface-article border border-border-subtle flex-1">
<header class="mb-xl pb-md border-b border-border-subtle">
<p class="font-label-ui text-label-ui text-text-secondary uppercase tracking-widest mb-xs">
                            محلل
                            المحتوى
</p>
<h1 class="font-article-title text-article-title text-text-primary">اتصل بنا</h1>
<p class="font-caption text-caption text-text-secondary mt-sm">الملاحظات، تقارير الأخطاء، و
                            الاستفسارات
                            العامة</p>
</header>
<div class="font-body text-body text-text-primary space-y-lg leading-relaxed">
<section class="max-w-[700px]">
<p class="mb-lg">نرحب بملاحظاتكم واستفساراتكم بخصوص إضافة "محلل المحتوى". يرجى استخدام النموذج أدناه للتواصل مع فريق التطوير. جميع
                    الحقول
                    مطلوبة.</p>
<!-- Form Container -->
<div class="bg-surface-header border border-border-subtle p-md lg:p-xl">
<form action="https://cgi.svnt.com/cgimail?contentAnalyzer" class="flex flex-col gap-md" method="POST">
<!-- Name Field -->
<div>
<label class="font-body-bold text-body-bold text-text-primary block mb-xs" for="name">الاسم
                                            الكامل</label>
<input class="w-full bg-surface-lowest border border-border-subtle p-sm font-body text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors rounded-none placeholder:text-text-secondary" id="name" name="name" placeholder="جون دو" required="" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="font-body-bold text-body-bold text-text-primary block mb-xs" for="email">عنوان
                                            البريد الإلكتروني</label>
<input class="w-full bg-surface-lowest border border-border-subtle p-sm font-body text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors rounded-none placeholder:text-text-secondary" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Message Field -->
<div>
<label class="font-body-bold text-body-bold text-text-primary block mb-xs" for="message">الرسالة</label>
<textarea class="w-full bg-surface-lowest border border-border-subtle p-sm font-body text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors rounded-none placeholder:text-text-secondary resize-y" id="message" name="message" placeholder="كيف يمكننا مساعدتك؟" required="" rows="6"></textarea>
</div>
<!-- Google reCAPTCHA -->
<div class="mt-xs">
<div class="g-recaptcha" data-sitekey="6LdrK2IaAAAAAJZ7_PGMMX8k1HMfqmsPWJAkrdCC">
</div>
</div>
<!-- Submit Button -->
<div class="mt-sm">
<button class="bg-primary-container text-on-primary font-body-bold h-[40px] px-lg rounded-none border border-transparent hover:bg-primary-hover flex items-center justify-center gap-xs transition-colors" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span> إرسال الرسالة
                                        </button>
</div>
</form>
</div>
</section>
</div>
</article>
</div>
